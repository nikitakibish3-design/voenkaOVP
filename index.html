<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Огневая подготовка — версия 2.2, оригинальная схема из PDF</title>
<style>
:root{box-sizing:border-box;--bg:#f4f4f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#d9d9d3;--ok:#1e8e3e;--okb:#d8f3e0;--no:#c5221f;--nob:#fbdcdb;--ac:#3b5b3a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#222320;--tx:#ecece8;--mut:#9a9a94;--bd:#3a3b37;--okb:#173a22;--nob:#44201f;--ac:#7fae7e}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
#app{max-width:640px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:15px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.tag{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:21px;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{cursor:default}
.next,.btn{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 18px inherit;font-family:inherit;margin-top:6px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.msg{font-weight:600;margin:4px 0 8px}
.center{margin:auto 0;text-align:center}
h1{font-size:26px;margin:0 0 6px}p{color:var(--mut)}
.exp{background:var(--card);border:2px solid var(--bd);border-left:5px solid var(--ac);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:16px;color:var(--tx)}
.row{display:flex;gap:8px}.row .btn{margin-top:10px}

.exam-start{background:#243d29!important;border:1px solid #557a59!important}
.menu-note{text-align:left;line-height:1.55;margin-top:18px}
.nav-row{display:flex;gap:10px;margin-top:10px}
.nav-row .btn{flex:1;margin-top:0}
.btn:disabled{opacity:.38;cursor:not-allowed}
.opt.selected{border-color:var(--ac);background:rgba(59,91,58,.14);box-shadow:inset 0 0 0 1px var(--ac)}
.choice-letter{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;margin-right:10px;border-radius:8px;background:var(--bd);font-size:14px;font-weight:700}
.exam-map{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:16px}
.question-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}
.qnum{min-height:40px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:600 15px system-ui;cursor:pointer}
.qnum.answered{background:var(--okb);border-color:var(--ok)}
.qnum.current{outline:2px solid var(--ac);outline-offset:1px}
.caption{font-size:13px;color:var(--mut);margin-top:8px}
.finish-btn{background:#7b3430!important}
.score{font-size:48px;font-weight:800;line-height:1.1;margin:10px 0}
.review-title{font-size:22px;margin:28px 0 12px}
.review-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.review-card .q{font-size:18px}
.review-answer{padding:9px 11px;border-radius:8px;margin:7px 0;font-size:15px}
.review-answer.bad{background:var(--nob);color:var(--no)}
.review-answer.good{background:var(--okb);color:var(--ok)}
@media(max-width:420px){.question-grid{grid-template-columns:repeat(6,1fr)}.qnum{min-height:36px}}


.option-explanations{margin:10px 0}
.option-explanation{padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:8px 0;background:var(--card)}
.option-explanation.is-correct{border-left:4px solid var(--ok)}
.option-explanation.was-selected:not(.is-correct){border-left:4px solid var(--no)}
.option-explanation-title{font-size:13px;font-weight:800;margin-bottom:4px;color:var(--mut)}
.option-explanation.is-correct .option-explanation-title{color:var(--ok)}
.option-explanation.was-selected:not(.is-correct) .option-explanation-title{color:var(--no)}
.option-explanation-text{font-size:15px;line-height:1.45}


.diagram-wrap{margin-top:12px;padding:8px;background:#fff;border-radius:10px}
.trajectory-diagram{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}


.wind-scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;color:#242424}
.wind-scale>div{padding:10px;border:1px solid #d7d7d7;border-radius:9px;background:#fff;display:flex;flex-direction:column;gap:5px}
.wind-scale b{font-size:14px}
.wind-scale span{font-weight:800;font-size:16px}
.wind-scale small{font-size:12px;line-height:1.35;color:#555}
@media(max-width:520px){.wind-scale{grid-template-columns:1fr}}


.wind-one{display:flex;flex-direction:column;gap:5px;margin-top:12px;padding:12px;border-radius:9px;background:#fff;color:#222;border:1px solid #ddd}
.wind-one strong{font-size:20px}
.wind-one span{font-size:14px;line-height:1.4;color:#555}
.wind-one.weak{border-left:4px solid #6d9b76}
.wind-one.moderate{border-left:4px solid #b38a43}
.wind-one.strong{border-left:4px solid #a95650}


.angle-compare{margin-top:12px;padding:12px;border:1px solid #c9b58b;border-radius:10px;background:#fffdf7;color:#222}
.angle-compare>b{display:block;margin-bottom:8px}
.angle-row{display:grid;grid-template-columns:minmax(110px, .8fr) 1.4fr;gap:8px;padding:8px 0;border-top:1px solid #e7dfcf}
.angle-row strong{font-size:14px}
.angle-row span{font-size:14px}
.angle-compare p{margin:8px 0 0;color:#555;font-size:13px;line-height:1.45}


.ballistics-reference{margin:12px 0 16px;padding:10px;background:#fff;border:1px solid #d8d8d2;border-radius:12px;color:#222}
.ballistics-reference-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ballistics-reference-head b{font-size:14px}
.ballistics-reference-head span{font-size:12px;color:#666}
.trajectory-diagram{display:block;width:100%;height:auto;max-height:none;object-fit:contain}
.ballistics-reference .caption{margin-top:7px;font-size:12px;color:#666;line-height:1.4}

</style></head><body><div id="app"></div>

const OG=`Предназначение автомата Калашникова (АК-74)|Уничтожение живой силы и поражение огневых средств противника; в рукопашном бою присоединяется штык-нож|Уничтожение бронетехники противника; в рукопашном бою присоединяется штык-нож|Уничтожение живой силы и огневых средств; в рукопашном бою используются сошки|Поражение живой силы только на коротких расстояниях|Для рукопашного боя к автомату присоединяется штык-нож.

const TRAINER_VERSION="2.2";
let saved={};
try{saved=JSON.parse(localStorage.getItem("voenka")||"{}")}catch(e){}
let examProgress=null;
try{examProgress=JSON.parse(localStorage.getItem("voenka_exam_progress_v2")||"null")}catch(e){}
function save(){try{localStorage.setItem("voenka",JSON.stringify(saved))}catch(e){}}
function persistExamProgress(){
  if(mode!=="exam"||examQueue.length!==36)return;
  examProgress={version:TRAINER_VERSION,questionIds:examQueue.map(c=>c.n),options:examOptions,answers:examAnswers,index:idx};
  try{localStorage.setItem("voenka_exam_progress_v2",JSON.stringify(examProgress))}catch(e){}
}
function clearExamProgress(){
  examProgress=null;
  try{localStorage.removeItem("voenka_exam_progress_v2")}catch(e){}
}
function resumeExam(){
  if(!examProgress||!Array.isArray(examProgress.questionIds))return menu();
  const restored=examProgress.questionIds.map(n=>ALL.find(c=>c.n===n)).filter(Boolean);
  if(restored.length!==36){clearExamProgress();return menu()}
  mode="exam";examQueue=restored;examAnswers=examProgress.answers||{};examOptions=examProgress.options||{};
  examQueue.forEach(c=>{if(!Array.isArray(examOptions[c.n]))examOptions[c.n]=sh(c.o)});
  idx=Math.max(0,Math.min(35,Number(examProgress.index)||0));
  renderExam();
}

function menu(){
  const nW=ALL.filter(c=>saved[c.q]).length;
  app.innerHTML=`
    <div class="center">
      <div class="tag">Тренажёр для подготовки</div>
      <h1>Огневая подготовка</h1>
      <p>${ALL.length} вопросов из загруженного файла. Выбирай режим занятий.</p>
      <button class="btn" data-m="all">Тренировка — все вопросы вперемешку</button>
      <button class="btn sec" data-m="order">По порядку (№1–${ALL.length})</button>
      <button class="btn sec" data-m="wind">Отдельный раздел: боковой ветер (12 вопросов)</button>
      ${examProgress&&Array.isArray(examProgress.questionIds)&&examProgress.questionIds.length===36?`<button class="btn" id="resumeExam">ПРОДОЛЖИТЬ НАЧАТЫЙ ТЕСТ (${Object.keys(examProgress.answers||{}).length}/36)</button>`:""}
      <button class="btn exam-start" id="examStart">РЕАЛЬНЫЙ ТЕСТ — 36 ВОПРОСОВ</button>
      ${nW?`<button class="btn sec" data-m="saved">Повторить мои ошибки (${nW})</button>`:""}
      <div class="exp menu-note">
        <b>Версия:</b> ${TRAINER_VERSION}. Ответы в экзамене автоматически сохраняются в этом браузере после каждого действия. После перезагрузки можно продолжить тест.<br>
        <b>Тренировка:</b> ответ сразу проверяется, объяснение появляется после выбора, ошибки возвращаются на повтор.<br>
        <b>Реальный тест:</b> 36 случайных вопросов, варианты перемешаны, ответы можно менять и проверять только после завершения.<br>
        <b>Боковой ветер:</b> 12 вопросов по определениям, единицам, группировке образцов, категориям ветра и условиям из конспекта.
      </div>
    </div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
  document.getElementById("examStart").onclick=startExam;
  const resumeBtn=document.getElementById("resumeExam");if(resumeBtn)resumeBtn.onclick=resumeExam;
}

function start(m){
  mode=m;
  const pool=(m==="all"||m==="order")?ALL:m==="saved"?ALL.filter(c=>saved[c.q]):m==="wind"?ALL.filter(c=>c.n>=159&&c.n<=170):ALL.filter(c=>c.t===m);
  queue=m==="order"?pool.slice():sh(pool);
  idx=0;wrong=[];right=0;total=queue.length;studyAnswers={};
  showStudy();
}


function sourceBasedNote(c){
  const answer=String(c.c||"").trim();
  const q=String(c.q||"").trim();
  if(/\d/.test(answer)){
    return `В конспекте для этого вопроса приведено конкретное значение: «${answer}». Сверяй его вместе с единицами измерения и условием, указанным в самом вопросе.`;
  }
  if(/[;•]/.test(answer)||answer.split(",").length>=3){
    return `Это вопрос на полный перечень. По конспекту правильный вариант включает: «${answer}». При проверке важно не пропустить пункт и не добавить то, чего в перечне нет.`;
  }
  if(/порядок|последовательность/i.test(q)){
    return `Конспект приводит для этого вопроса определённую последовательность. Сверяй выбранный вариант с формулировкой: «${answer}». Важно не менять местами пункты и не добавлять лишние действия.`;
  }
  return `В конспекте правильный ответ сформулирован так: «${answer}». Вопрос проверяет именно это определение или назначение; близкие по звучанию формулировки могут относиться к другому элементу.`;
}
function ballisticsVisualHTML(c){
  if(c.n<124||c.n>133)return "";
  return `<section class="ballistics-reference">
    <div class="ballistics-reference-head"><b>Схема из конспекта — страница 18</b><span>Для вопросов 124–133</span></div>
    <img class="trajectory-diagram" src="data:image/png;base64,${diagram64}" alt="Оригинальная схема элементов траектории из конспекта: линии бросания, возвышения и прицеливания; углы; вершина и высота траектории; точка вылета, точка падения и полная горизонтальная дальность">
    <div class="caption">На схеме отдельно подписан «угол возвышения»; в текстовой части конспекта его отдельное определение не приведено. Схема показана до выбора ответа, чтобы можно было сверять подписи во время обучения. Вертикальный масштаб сильно увеличен.</div>
  </section>`;
}
function explanationHTML(c,selected){
  const lesson=SAFE_LESSONS[c.n];
  if(!lesson){
    if(WIND_LESSONS[c.n]){
      let windCard="";
      if(c.n===164||c.n===165) windCard='<div class="wind-one weak"><b>Слабый ветер</b><strong>2–3 м/с</strong><span>Платок и флаг колышутся и слегка развеваются</span></div>';
      if(c.n===166||c.n===167) windCard='<div class="wind-one moderate"><b>Умеренный ветер</b><strong>4–6 м/с</strong><span>Флаг держится развёрнутым, платок развевается</span></div>';
      if(c.n===168||c.n===169) windCard='<div class="wind-one strong"><b>Сильный ветер</b><strong>8–12 м/с</strong><span>Флаг с шумом развевается, платок рвётся из рук</span></div>';
      if(c.n===163) windCard='<div class="wind-scale"><div><b>Слабый</b><span>2–3 м/с</span><small>Лёгкое колебание</small></div><div><b>Умеренный</b><span>4–6 м/с</span><small>Флаг развёрнут</small></div><div><b>Сильный</b><span>8–12 м/с</span><small>Флаг шумит</small></div></div>';
      return `<div class="exp"><b>Пояснение именно к этому вопросу:</b> ${esc(WIND_LESSONS[c.n])}${windCard}<div class="caption">Источник: конспект, страница 23.</div></div>`;
    }
    if(BALLISTICS_LESSONS[c.n]){
      return `<div class="exp"><b>Пояснение:</b> ${esc(BALLISTICS_LESSONS[c.n])}

      ${c.n===126||c.n===127?`<div class="angle-compare">
        <b>Не путай два угла</b>
        <div class="angle-row"><strong>Угол бросания</strong><span>Линия бросания ↔ горизонт оружия</span></div>
        <div class="angle-row"><strong>Угол вылета</strong><span>Линия возвышения ↔ линия бросания</span></div>
        <p>Общая линия у этих определений — линия бросания. Вторые стороны разные, поэтому это не одно и то же.</p>
      </div>`:""}
      </div>`;
    }
    return `<div class="exp">💡 ${esc(c.e||sourceBasedNote(c))}</div>`;
  }
  return `<div class="exp"><b>Разбираем суть:</b> ${esc(lesson.summary)}
    <div class="option-explanations"><div class="tag">Почему варианты подходят или не подходят</div>
    ${c.o.map(o=>`<div class="option-explanation ${o===c.c?"is-correct":""} ${o===selected?"was-selected":""}"><div class="option-explanation-title">${o===c.c?"✓ Правильный вариант":o===selected?"✕ Твой выбор":"Другой вариант"}</div><div class="option-explanation-text">${esc(lesson.why[o]||"Формулировка не совпадает с ответом, приведённым в конспекте.")}</div></div>`).join("")}
    </div></div>`;
}
function showStudy(){
  if(idx>=queue.length){
    if(wrong.length){
      queue=sh(wrong);
      wrong=[];
      idx=0;
      studyAnswers={};
      return round();
    }
    return done();
  }
  const c=queue[idx],chosen=studyAnswers[idx];
  const opts=chosen?chosen.opts:sh(c.o);
  if(!chosen) studyAnswers[idx]={opts,selected:null};

  app.innerHTML=`
    <div class="top">
      <span>${idx+1} / ${queue.length}</span>
      <span>✔ ${right}</span>
      <span class="menu-link">меню</span>
    </div>
    <div class="bar"><i style="width:${(idx+1)/queue.length*100}%"></i></div>
    <div class="tag">Тренировка · вопрос №${c.n} из ${ALL.length}</div>
    <div class="q">${esc(c.q)}</div>
    ${ballisticsVisualHTML(c)}
    <div id="opts">${opts.map(o=>{
      let cls="opt";
      if(chosen && chosen.selected!==null){
        if(o===c.c) cls+=" ok";
        else if(o===chosen.selected) cls+=" no";
      }
      return `<button class="${cls}" data-opt="${esc(o)}" ${chosen&&chosen.selected!==null?"disabled":""}>${esc(o)}</button>`;
    }).join("")}</div>
    <div id="fb"></div>
    <div class="nav-row">
      <button class="btn sec" id="prev" ${idx===0?"disabled":""}>← Назад</button>
      <button class="btn" id="next" ${!chosen||chosen.selected===null?"disabled":""}>Далее →</button>
    </div>`;
  app.querySelector(".menu-link").onclick=menu;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>answerStudy(b.dataset.opt,c));
  document.getElementById("prev").onclick=()=>{if(idx>0){idx--;showStudy()}};
  document.getElementById("next").onclick=()=>{if(studyAnswers[idx]?.selected!==null){idx++;showStudy()}};

  if(chosen && chosen.selected!==null){
    const ok=chosen.selected===c.c;
    document.getElementById("fb").innerHTML=`
      <div class="msg" style="color:var(--${ok?"ok":"no"})">${ok?"Верно!":"Неверно"}</div>
      ${explanationHTML(c,chosen.selected)}
      <div class="caption">Можно вернуться назад и ещё раз разобрать все варианты.</div>`;
  }
}

function answerStudy(value,c){
  if(studyAnswers[idx]?.selected!==null) return;
  studyAnswers[idx].selected=value;
  const ok=value===c.c;
  if(ok){
    right++;
    delete saved[c.q];
  }else{
    wrong.push(c);
    saved[c.q]=1;
  }
  save();
  showStudy();
}

function round(){
  app.innerHTML=`
    <div class="center">
      <div class="tag">Следующий этап</div>
      <h1>Повтор ошибок</h1>
      <p>Осталось вопросов для повторения: <b>${queue.length}</b>.</p>
      <p>На этот раз внимательно прочитай формулировку и сравни варианты.</p>
      <button class="btn" id="go">Продолжить</button>
      <button class="btn sec" id="backMenu">В меню</button>
    </div>`;
  document.getElementById("go").onclick=showStudy;
  document.getElementById("backMenu").onclick=menu;
}

function done(){
  app.innerHTML=`
    <div class="center">
      <div class="tag">Тренировка завершена</div>
      <h1>Отличная работа!</h1>
      <p>Ошибки этого круга разобраны. Правильных ответов с первой попытки: <b>${right}</b> из ${total}.</p>
      <button class="btn" id="again">Пройти ещё раз</button>
      <button class="btn sec" id="toMenu">В меню</button>
    </div>`;
  document.getElementById("again").onclick=()=>start(mode);
  document.getElementById("toMenu").onclick=menu;
}

/* Реальный тест: 36 уникальных вопросов, без подсказок и обратной связи до сдачи. */
function startExam(){
  if(examProgress&&Array.isArray(examProgress.questionIds)&&examProgress.questionIds.length===36){if(!confirm("Начать новый тест? Сохранённая незавершённая попытка будет заменена."))return;}
  clearExamProgress();
  mode="exam";
  examQueue=sh(ALL).slice(0,36);
  examAnswers={};
  examOptions={};
  examQueue.forEach(c=>examOptions[c.n]=sh(c.o));
  idx=0;
  renderExam();
}

function renderExam(){
  persistExamProgress();
  const c=examQueue[idx];
  const answered=Object.keys(examAnswers).length;
  const selected=examAnswers[c.n]||null;

  app.innerHTML=`
    <div class="top">
      <span>ЭКЗАМЕН · ${idx+1} / 36</span>
      <span>Отвечено: ${answered} / 36</span>
      <span class="menu-link">меню</span>
    </div>
    <div class="bar"><i style="width:${answered/36*100}%"></i></div>
    <div class="tag">Реальный тест · вопрос ${idx+1}</div>
    <div class="q">${esc(c.q)}</div>
    <div id="examOpts">
      ${examOptions[c.n].map((o,i)=>`
        <button class="opt ${selected===o?"selected":""}" data-exam-opt="${i}">
          <span class="choice-letter">${["А","Б","В","Г"][i]}</span>${esc(o)}
        </button>`).join("")}
    </div>
    <div class="exam-map">
      <div class="tag">Переход к вопросу</div>
      <div class="question-grid">
        ${examQueue.map((item,i)=>`
          <button class="qnum ${i===idx?"current":""} ${examAnswers[item.n]?"answered":""}" data-jump="${i}">${i+1}</button>
        `).join("")}
      </div>
      <div class="caption">Зелёным отмечены вопросы, на которые уже дан ответ. Номер можно нажать, чтобы вернуться к нему.</div>
    </div>
    <div class="nav-row">
      <button class="btn sec" id="examPrev" ${idx===0?"disabled":""}>← Назад</button>
      <button class="btn" id="examNext" ${idx===35?"disabled":""}>Далее →</button>
    </div>
    <button class="btn finish-btn" id="finishExam">Завершить тест</button>
    <button class="btn sec" id="cancelExam">Выйти без результата</button>
  `;
  app.querySelector(".menu-link").onclick=()=>{
    if(confirm("Свернуть тест? Все выбранные ответы сохранятся. Позже можно будет продолжить с того же места.")) menu();
  };
  app.querySelectorAll("[data-exam-opt]").forEach(b=>b.onclick=()=>{
    const option=examOptions[c.n][Number(b.dataset.examOpt)];
    examAnswers[c.n]=option;
    renderExam();
  });
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    idx=Number(b.dataset.jump);
    renderExam();
  });
  document.getElementById("examPrev").onclick=()=>{if(idx>0){idx--;renderExam()}};
  document.getElementById("examNext").onclick=()=>{if(idx<35){idx++;renderExam()}};
  document.getElementById("finishExam").onclick=finishExam;
  document.getElementById("cancelExam").onclick=()=>{
    if(confirm("Удалить текущую попытку и выйти без результата?")){clearExamProgress();menu();}
  };
}

function finishExam(){
  const unanswered=examQueue.filter(c=>!examAnswers[c.n]).length;
  if(unanswered && !confirm(`Без ответа осталось ${unanswered}. Завершить тест?`)) return;

  let correct=0, mistakes=[];
  examQueue.forEach(c=>{
    const chosen=examAnswers[c.n]||null;
    if(chosen===c.c){
      correct++;
      delete saved[c.q];
    }else{
      mistakes.push({c,chosen});
      saved[c.q]=1;
    }
  });
  save();
  clearExamProgress();
  const percent=Math.round(correct/36*100);
  app.innerHTML=`
    <div class="center">
      <div class="tag">Результат реального теста</div>
      <h1>${correct} из 36</h1>
      <div class="score">${percent}%</div>
      <p>Правильных ответов: <b>${correct}</b><br>
      Ошибок: <b>${mistakes.length-unanswered}</b><br>
      Без ответа: <b>${unanswered}</b></p>
      <p>Результат показан без автоматической отметки «сдал/не сдал»: проходной балл зависит от требований вашего зачёта.</p>
      <button class="btn" id="reviewBtn">Разобрать ошибки (${mistakes.length})</button>
      <button class="btn sec" id="newExam">Новый тест на 36 вопросов</button>
      <button class="btn sec" id="menuBtn">В меню</button>
    </div>
    <div id="mistakeReview"></div>`;
  document.getElementById("reviewBtn").onclick=()=>{
    const box=document.getElementById("mistakeReview");
    if(!mistakes.length){
      box.innerHTML='<div class="exp">Ошибок нет — все 36 вопросов отвечены правильно. Отличный результат!</div>';
      return;
    }
    box.innerHTML=`
      <h2 class="review-title">Разбор ошибок</h2>
      ${mistakes.map((m,i)=>`
        <div class="review-card">
          <div class="tag">Вопрос №${m.c.n} · ${i+1} из ${mistakes.length}</div>
          <div class="q">${esc(m.c.q)}</div>
          <div class="review-answer bad">Твой ответ: ${m.chosen?esc(m.chosen):"Без ответа"}</div>
          <div class="review-answer good">Правильный ответ: ${esc(m.c.c)}</div>
          ${explanationHTML(m.c,m.chosen)}
        </div>`).join("")}`;
    box.scrollIntoView({behavior:"smooth",block:"start"});
  };
  document.getElementById("newExam").onclick=startExam;
  document.getElementById("menuBtn").onclick=menu;
}

menu();
</script></body></html>
