const parse=(s,t)=>s.trim().split("\n").map((l,i)=>{const a=l.split("|");return{t,n:i+1,q:a[0],c:a[1],o:a.slice(1,5),e:a[5]||""}});
const ALL=parse(OG,"Огневая подготовка");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById("app");
let queue=[],idx=0,wrong=[],right=0,total=0,mode="";
let saved={};try{saved=JSON.parse(localStorage.getItem("voenka")||"{}")}catch(e){}
function save(){try{localStorage.setItem("voenka",JSON.stringify(saved))}catch(e){}}
function menu(){
  const nW=ALL.filter(c=>saved[c.q]).length;
  app.innerHTML=`<div class="center"><h1>Огневая подготовка</h1><p>${ALL.length} вопросов с вариантами ответа, как в ответнике. Ошибки повторяются в конце круга.</p>
  <button class="btn" data-m="all">Все вопросы вперемешку</button>
  <button class="btn sec" data-m="order">По порядку (№1–157)</button>
  
  ${nW?`<button class="btn sec" data-m="saved">Мои ошибки из прошлых раз (${nW})</button>`:""}</div>`;
  app.querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function start(m){
  mode=m;let pool=(m=="all"||m=="order")?ALL:m=="saved"?ALL.filter(c=>saved[c.q]):ALL.filter(c=>c.t==m);
  queue=m=="order"?pool.slice():sh(pool);idx=0;wrong=[];right=0;total=queue.length;show();
}
function show(){
  if(idx>=queue.length){
    if(wrong.length){queue=sh(wrong);wrong=[];idx=0;return round()}
    return done()}
  const c=queue[idx],opts=sh(c.o);
  app.innerHTML=`<div class="top"><span>${idx+1} / ${queue.length}</span><span>✔ ${right}</span><span class="menu" style="cursor:pointer">меню</span></div>
  <div class="bar"><i style="width:${idx/queue.length*100}%"></i></div>
  <div class="tag">Вопрос №${c.n} из ${ALL.length}</div><div class="q">${c.q}</div>
  <div id="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><div id="fb"></div>`;
  app.querySelector(".menu").onclick=menu;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,c));
}
function round(){app.innerHTML=`<div class="center"><h1>Повтор ошибок</h1><p>Осталось ${queue.length} карточек, которые вы пропустили.</p><button class="btn" id="go">Поехали</button></div>`;document.getElementById("go").onclick=show}
function answer(b,c){
  const ok=b.textContent==c.c;
  app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==c.c)x.classList.add("ok")});
  if(ok){right++;delete saved[c.q]}else{b.classList.add("no");wrong.push(c);saved[c.q]=1}
  save();
  document.getElementById("fb").innerHTML=`<div class="msg" style="color:var(--${ok?"ok":"no"})">${ok?"Верно!":"Неверно"}</div>${c.e?`<div class="exp">💡 ${c.e}</div>`:""}<button class="next" id="nx">Дальше</button>`;
  const nx=document.getElementById("nx");nx.onclick=()=>{idx++;show()};nx.focus();
}
function done(){app.innerHTML=`<div class="center"><h1>Круг пройден</h1><p>Все карточки разобраны.</p><button class="btn" id="a">Ещё раз</button><button class="btn sec" id="m">В меню</button></div>`;
  document.getElementById("a").onclick=()=>start(mode);document.getElementById("m").onclick=menu}
menu();
</script></body></html>
