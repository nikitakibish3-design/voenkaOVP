<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Огневая подготовка — итоговый тренажёр по конспекту</title>
<style>
:root{box-sizing:border-box;--bg:#f4f4f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#d9d9d3;--ok:#1e8e3e;--okb:#d8f3e0;--no:#c5221f;--nob:#fbdcdb;--ac:#3b5b3a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
#app{max-width:640px;margin:0 auto;padding:14px;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:15px;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.tag{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.q{font-size:21px;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{cursor:default}
.next,.btn{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 18px inherit;font-family:inherit;margin-top:6px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.msg{font-weight:600;margin:4px 0 8px}
.center{margin:auto 0;text-align:center}
h1{font-size:26px;margin:0 0 6px}p{color:var(--mut)}
.exp{background:var(--card);border:2px solid var(--bd);border-left:5px solid var(--ac);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:16px;color:var(--tx)}
.row{display:flex;gap:8px}.row .btn{margin-top:10px}

.exam-start{background:#243d29!important;border:1px solid #557a59!important}
.menu-note{text-align:left;line-height:1.55;margin-top:18px}
.nav-row{display:flex;gap:10px;margin-top:10px}
.nav-row .btn{flex:1;margin-top:0}
.btn:disabled{opacity:.38;cursor:not-allowed}
.opt.selected{border-color:var(--ac);background:rgba(59,91,58,.14);box-shadow:inset 0 0 0 1px var(--ac)}
.choice-letter{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;margin-right:10px;border-radius:8px;background:var(--bd);font-size:14px;font-weight:700}
.exam-map{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:16px}
.question-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}
.qnum{min-height:40px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:600 15px system-ui;cursor:pointer}
.qnum.answered{background:var(--okb);border-color:var(--ok)}
.qnum.current{outline:2px solid var(--ac);outline-offset:1px}
.caption{font-size:13px;color:var(--mut);margin-top:8px}
.finish-btn{background:#7b3430!important}
.score{font-size:48px;font-weight:800;line-height:1.1;margin:10px 0}
.review-title{font-size:22px;margin:28px 0 12px}
.review-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.review-card .q{font-size:18px}
.review-answer{padding:9px 11px;border-radius:8px;margin:7px 0;font-size:15px}
.review-answer.bad{background:var(--nob);color:var(--no)}
.review-answer.good{background:var(--okb);color:var(--ok)}
@media(max-width:420px){.question-grid{grid-template-columns:repeat(6,1fr)}.qnum{min-height:36px}}


.option-explanations{margin:10px 0}
.option-explanation{padding:10px 12px;border:1px solid var(--bd);border-radius:9px;margin:8px 0;background:var(--card)}
.option-explanation.is-correct{border-left:4px solid var(--ok)}
.option-explanation.was-selected:not(.is-correct){border-left:4px solid var(--no)}
.option-explanation-title{font-size:13px;font-weight:800;margin-bottom:4px;color:var(--mut)}
.option-explanation.is-correct .option-explanation-title{color:var(--ok)}
.option-explanation.was-selected:not(.is-correct) .option-explanation-title{color:var(--no)}
.option-explanation-text{font-size:15px;line-height:1.45}


.diagram-wrap{margin-top:12px;padding:8px;background:#fff;border-radius:10px}
.trajectory-diagram{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}


.wind-scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;color:#242424}
.wind-scale>div{padding:10px;border:1px solid #d7d7d7;border-radius:9px;background:#fff;display:flex;flex-direction:column;gap:5px}
.wind-scale b{font-size:14px}
.wind-scale span{font-weight:800;font-size:16px}
.wind-scale small{font-size:12px;line-height:1.35;color:#555}
@media(max-width:520px){.wind-scale{grid-template-columns:1fr}}

</style></head><body><div id="app"></div>

const sh=a=>{
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
};

function showStudy(){
  if(idx>=queue.length){
    if(wrong.length){
      queue=sh(wrong);
      wrong=[];
      idx=0;
      studyAnswers={};
      return round();
    }
    return done();
  }
  const c=queue[idx],chosen=studyAnswers[idx];
  const opts=chosen?chosen.opts:sh(c.o);
  if(!chosen) studyAnswers[idx]={opts,selected:null};

  app.innerHTML=`
    <div class="top">
      <span>${idx+1} / ${queue.length}</span>
      <span>✔ ${right}</span>
      <span class="menu-link">меню</span>
    </div>
    <div class="bar"><i style="width:${(idx+1)/queue.length*100}%"></i></div>
    <div class="tag">Тренировка · вопрос №${c.n} из ${ALL.length}</div>
    <div class="q">${esc(c.q)}</div>
    <div id="opts">${opts.map(o=>{
      let cls="opt";
      if(chosen && chosen.selected!==null){
        if(o===c.c) cls+=" ok";
        else if(o===chosen.selected) cls+=" no";
      }
      return `<button class="${cls}" data-opt="${esc(o)}" ${chosen&&chosen.selected!==null?"disabled":""}>${esc(o)}</button>`;
    }).join("")}</div>
    <div id="fb"></div>
    <div class="nav-row">
      <button class="btn sec" id="prev" ${idx===0?"disabled":""}>← Назад</button>
      <button class="btn" id="next" ${!chosen||chosen.selected===null?"disabled":""}>Далее →</button>
    </div>`;
  app.querySelector(".menu-link").onclick=menu;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>answerStudy(b.dataset.opt,c));
  document.getElementById("prev").onclick=()=>{if(idx>0){idx--;showStudy()}};
  document.getElementById("next").onclick=()=>{if(studyAnswers[idx]?.selected!==null){idx++;showStudy()}};

  if(chosen && chosen.selected!==null){
    const ok=chosen.selected===c.c;
    document.getElementById("fb").innerHTML=`
      <div class="msg" style="color:var(--${ok?"ok":"no"})">${ok?"Верно!":"Неверно"}</div>
      ${explanationHTML(c,chosen.selected)}
      <div class="caption">Можно вернуться назад и ещё раз разобрать все варианты.</div>`;
  }
}

function answerStudy(value,c){
  if(studyAnswers[idx]?.selected!==null) return;
  studyAnswers[idx].selected=value;
  const ok=value===c.c;
  if(ok){
    right++;
    delete saved[c.q];
  }else{
    wrong.push(c);
    saved[c.q]=1;
  }
  save();
  showStudy();
}

function round(){
  app.innerHTML=`
    <div class="center">
      <div class="tag">Следующий этап</div>
      <h1>Повтор ошибок</h1>
      <p>Осталось вопросов для повторения: <b>${queue.length}</b>.</p>
      <p>На этот раз внимательно прочитай формулировку и сравни варианты.</p>
      <button class="btn" id="go">Продолжить</button>
      <button class="btn sec" id="backMenu">В меню</button>
    </div>`;
  document.getElementById("go").onclick=showStudy;
  document.getElementById("backMenu").onclick=menu;
}

function done(){
  app.innerHTML=`
    <div class="center">
      <div class="tag">Тренировка завершена</div>
      <h1>Отличная работа!</h1>
      <p>Ошибки этого круга разобраны. Правильных ответов с первой попытки: <b>${right}</b> из ${total}.</p>
      <button class="btn" id="again">Пройти ещё раз</button>
      <button class="btn sec" id="toMenu">В меню</button>
    </div>`;
  document.getElementById("again").onclick=()=>start(mode);
  document.getElementById("toMenu").onclick=menu;
}

/* Реальный тест: 36 уникальных вопросов, без подсказок и обратной связи до сдачи. */
function startExam(){
  mode="exam";
  examQueue=sh(ALL).slice(0,36);
  examAnswers={};
  examOptions={};
  examQueue.forEach(c=>examOptions[c.n]=sh(c.o));
  idx=0;
  renderExam();
}

function renderExam(){
  const c=examQueue[idx];
  const answered=Object.keys(examAnswers).length;
  const selected=examAnswers[c.n]||null;

  app.innerHTML=`
    <div class="top">
      <span>ЭКЗАМЕН · ${idx+1} / 36</span>
      <span>Отвечено: ${answered} / 36</span>
      <span class="menu-link">меню</span>
    </div>
    <div class="bar"><i style="width:${answered/36*100}%"></i></div>
    <div class="tag">Реальный тест · вопрос ${idx+1}</div>
    <div class="q">${esc(c.q)}</div>
    <div id="examOpts">
      ${examOptions[c.n].map((o,i)=>`
        <button class="opt ${selected===o?"selected":""}" data-exam-opt="${i}">
          <span class="choice-letter">${["А","Б","В","Г"][i]}</span>${esc(o)}
        </button>`).join("")}
    </div>
    <div class="exam-map">
      <div class="tag">Переход к вопросу</div>
      <div class="question-grid">
        ${examQueue.map((item,i)=>`
          <button class="qnum ${i===idx?"current":""} ${examAnswers[item.n]?"answered":""}" data-jump="${i}">${i+1}</button>
        `).join("")}
      </div>
      <div class="caption">Зелёным отмечены вопросы, на которые уже дан ответ. Номер можно нажать, чтобы вернуться к нему.</div>
    </div>
    <div class="nav-row">
      <button class="btn sec" id="examPrev" ${idx===0?"disabled":""}>← Назад</button>
      <button class="btn" id="examNext" ${idx===35?"disabled":""}>Далее →</button>
    </div>
    <button class="btn finish-btn" id="finishExam">Завершить тест</button>
    <button class="btn sec" id="cancelExam">Выйти без результата</button>
  `;
  app.querySelector(".menu-link").onclick=()=>{
    if(confirm("Выйти из теста? Текущие ответы не будут засчитаны.")) menu();
  };
  app.querySelectorAll("[data-exam-opt]").forEach(b=>b.onclick=()=>{
    const option=examOptions[c.n][Number(b.dataset.examOpt)];
    examAnswers[c.n]=option;
    renderExam();
  });
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    idx=Number(b.dataset.jump);
    renderExam();
  });
  document.getElementById("examPrev").onclick=()=>{if(idx>0){idx--;renderExam()}};
  document.getElementById("examNext").onclick=()=>{if(idx<35){idx++;renderExam()}};
  document.getElementById("finishExam").onclick=finishExam;
  document.getElementById("cancelExam").onclick=()=>{
    if(confirm("Точно выйти? Результат этого теста не сохранится.")) menu();
  };
}

function finishExam(){
  const unanswered=examQueue.filter(c=>!examAnswers[c.n]).length;
  if(unanswered && !confirm(`Без ответа осталось ${unanswered}. Завершить тест?`)) return;

  let correct=0, mistakes=[];
  examQueue.forEach(c=>{
    const chosen=examAnswers[c.n]||null;
    if(chosen===c.c){
      correct++;
      delete saved[c.q];
    }else{
      mistakes.push({c,chosen});
      saved[c.q]=1;
    }
  });
  save();
  const percent=Math.round(correct/36*100);
  app.innerHTML=`
    <div class="center">
      <div class="tag">Результат реального теста</div>
      <h1>${correct} из 36</h1>
      <div class="score">${percent}%</div>
      <p>Правильных ответов: <b>${correct}</b><br>
      Ошибок: <b>${mistakes.length-unanswered}</b><br>
      Без ответа: <b>${unanswered}</b></p>
      <p>Результат показан без автоматической отметки «сдал/не сдал»: проходной балл зависит от требований вашего зачёта.</p>
      <button class="btn" id="reviewBtn">Разобрать ошибки (${mistakes.length})</button>
      <button class="btn sec" id="newExam">Новый тест на 36 вопросов</button>
      <button class="btn sec" id="menuBtn">В меню</button>
    </div>
    <div id="mistakeReview"></div>`;
  document.getElementById("reviewBtn").onclick=()=>{
    const box=document.getElementById("mistakeReview");
    if(!mistakes.length){
      box.innerHTML='<div class="exp">Ошибок нет — все 36 вопросов отвечены правильно. Отличный результат!</div>';
      return;
    }
    box.innerHTML=`
      <h2 class="review-title">Разбор ошибок</h2>
      ${mistakes.map((m,i)=>`
        <div class="review-card">
          <div class="tag">Вопрос №${m.c.n} · ${i+1} из ${mistakes.length}</div>
          <div class="q">${esc(m.c.q)}</div>
          <div class="review-answer bad">Твой ответ: ${m.chosen?esc(m.chosen):"Без ответа"}</div>
          <div class="review-answer good">Правильный ответ: ${esc(m.c.c)}</div>
          ${explanationHTML(m.c,m.chosen)}
        </div>`).join("")}`;
    box.scrollIntoView({behavior:"smooth",block:"start"});
  };
  document.getElementById("newExam").onclick=startExam;
  document.getElementById("menuBtn").onclick=menu;
}

menu();
</script></body></html>
